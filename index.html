<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet">
    <title>Job Application Form</title>
</head>

<body>

    <main>

<!--1. DIV with class="container" -->
        <div class="container">

            <h1>Job Application Form</h1>

<!--2. FORM element -->
            <form>

<!-- 3. Full Name -->
                <label class="name" for="name">Full Name:</label>
                <input class="name" type="text" id="name" placeholder="Enter your name (e.g. Alice White)">

<!-- 4. Email -->
                <label class="name" for="email">Email:</label>
                <input class="email" type="email" id="email" placeholder="Enter your email (e.g. alice.white@gmail.com)">

<!-- 5. Selecting Job Position -->
                <label class="position" for="position">Position:</label>
                <select class="selector-position" name="position" id="position">

                    <option>Select a position</option>

                    <option value="front-end-dev">Front-End Web Developer</option>

                    <option value="ui-ux-designer">UI/UX Web Designer (Southern Team)</option>

                    <option value="ui-uk-front-end">UI/UX &amp; Front-End Developer (Northern Team)</option>

                    <option value="full-stack-js">Full-Stack JavaScript Web Developer </option>

                    <option value="full-stack-py">Full-Stack Python Web Developer </option>

                    <option value="manager">Web Development Team Manager</option>

                </select>

<!-- 6. Selecting Availability with radio buttons -->
                <fieldset class="radio-group">

                    <legend>Select Your Availability</legend>

                    <input type="radio" name="availability" id="full-time" value="Full-Time">
                    <label for="full-time">Full-Time</label>

                    <input type="radio" name="availability"
                    id="part-time"
                    value="Part-Time">
                    <label for="Part-Time">Part-Time</label>

                </fieldset>

<!-- 7. Motivation Text Area -->
                <label for="message">Why do you want this position with us?</label>
                <textarea id="message" placeholder="Write your motivation" rows="8" cols="50">
                </textarea>

<!-- 8. Submit Button -->
                <button type="submit">Submit</button>

            </form>

        </div>

    </main>
</body>
</html>
